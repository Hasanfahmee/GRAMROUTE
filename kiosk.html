<style>*{box-sizing:border-box;user-select:none}body{margin:0;font:22px system-ui,"Noto Sans","Nirmala UI",sans-serif;background:#F8FAFC;color:#334155;min-height:100vh;padding:14px 14px 330px}

const RC={en:"en-IN",as:"as-IN",bn:"bn-IN",gu:"gu-IN",hi:"hi-IN",kn:"kn-IN",ml:"ml-IN",mr:"mr-IN",ne:"ne-NP",or:"or-IN",pa:"pa-Guru-IN",ta:"ta-IN",te:"te-IN",ur:"ur-IN",ks:"ur-IN",sd:"ur-IN",brx:"hi-IN",doi:"hi-IN",kok:"hi-IN",mai:"hi-IN",sa:"hi-IN",sat:"en-IN",mni:"en-IN"};
const D0=()=>({name:"",village:"Kalpur",seats:"1",problem:"normal",bus:"B2",road:"Junction-College"});
const S={lang:"en",step:"lang",d:D0(),mute:false,res:null,ex:null,idle:0,eng:false};
const t=k=>(T[S.lang]&&T[S.lang][k])||T.en[k]||k,$=i=>document.getElementById(i),RTL=["ur","ks","sd"];
const P={Kalpur:[70,250],Junction:[260,160],College:[450,160],Mudhol:[150,50],Hosagram:[260,300]};
function go(s){S.step=s;render()}function reset(){S.d=D0();S.res=null;S.ex=null;go("lang")}
function svc(p){S.d.problem=p;go("form")}
function sel(id,o,v){return `<select onchange="S.d.${id}=this.value">`+o.map(x=>`<option ${x==v?"selected":""}>${x}</option>`).join("")+"</select>"}
const card=(k,f)=>`<button class="b p" onclick="${f}">${t(k)}</button>`;
function render(){document.documentElement.dir=RTL.includes(S.lang)?"rtl":"ltr";const a=$("app"),d=S.d;let h="";kbHide();
 if(S.step=="lang")h=`<h1>GRAMROUTE</h1><p>${t("tag")}</p><p>${t("pick")}</p><div class=g>`+LG.map(l=>`<button class=b onclick="S.lang='${l[0]}';go('svc')">${l[1]}</button>`).join("")+`</div><p><small>Fictional demo data.</small></p>`;
 else{
 if(S.step=="svc")h=`<h1>${t("pick")}</h1><div class=g>`+[["svcNormal","svc('normal')"],["svcBus","svc('bus')"],["svcRoad","svc('road')"],["svcSeats","svc('seats')"]].map(x=>card(x[0],x[1])).join("")+`<button class="b x" onclick="S.ex=null;go('exam')">🚨 ${t("svcExam")}</button><button class="b t" onclick="go('net')">${t("svcNet")}</button><button class="b t" onclick="go('track')">${t("svcTrack")}</button><button class=b onclick="go('help')">${t("svcHelp")}</button></div><div class=bar><button class=b onclick="reset()">${t("back")}</button></div>`;
 if(S.step=="form")h=`<h1>${t("svc"+{normal:"Normal",bus:"Bus",road:"Road",seats:"Seats"}[d.problem])}</h1><label>${t("name")}</label><input id=name data-kb=q readonly value="${d.name}" onfocus="kb(this)"><label>${t("village")}</label>${sel("village",["Kalpur","Mudhol","Hosagram"],d.village)}<label>${t("seats")}</label><input id=seats data-kb=n readonly value="${d.seats}" onfocus="kb(this)">`+(d.problem=="bus"?`<label>${t("bus")}</label>${sel("bus",["B1","B2","B3"],d.bus)}`:"")+(d.problem=="road"?`<label>${t("road")}</label>${sel("road",["Junction-College","Kalpur-Junction","Mudhol-Junction","Hosagram-Junction"],d.road)}`:"")+`<div id=er class=e></div><div class=bar><button class=b onclick="go('svc')">${t("back")}</button><button class="b p" onclick="chk()">${t("next")}</button></div>`;
 if(S.step=="review")h=`<h1>${t("review")}</h1><table><tr><th>${t("name")}</th><td>${d.name}</td></tr><tr><th>${t("village")}</th><td>${d.village}</td></tr><tr><th>${t("seats")}</th><td>${d.seats}</td></tr><tr><th>${t("problem")}</th><td>${d.problem}</td></tr>`+(d.problem=="bus"?`<tr><th>${t("bus")}</th><td>${d.bus}</td></tr>`:"")+(d.problem=="road"?`<tr><th>${t("road")}</th><td>${d.road}</td></tr>`:"")+`</table><div class=bar><button class=b onclick="go('form')">${t("back")}</button><button class="b t" onclick="submit()">${t("confirm")}</button></div>`;
 if(S.step=="busy")h=`<h1>Calculating on local server…</h1>`;
 if(S.step=="res"){const r=S.res;h=r.error?`<h1 class=e>${r.error}</h1>`:r.allocated?`<h1 class=ok>✔ Seat booked · ${t("ref")} ${r.ref}</h1>`+r.vehicles.map(v=>`<div class=card><b>${v.id}</b> ${v.kind} · ${v.seats} seat(s)<br>Pickup: <b>${v.pickup}</b> · Departs <b>${v.dep}</b> · Arrives about <b>${v.arrive}</b></div>`).join("")+`<p>Route: ${r.route.path.join(" → ")} · ${r.route.km} km · ~${Math.round(r.route.mins)} min</p>`+(r.waiting?`<div class=card><b>${r.waiting} more seat(s):</b> next departure ${r.batch2.map(b=>b.vehicle+" at "+b.dep).join(", ")}</div>`:""):`<h1 class=e>No seat free right now</h1><div class=card>Next departures: ${r.batch2.map(b=>b.vehicle+" at "+b.dep).join(", ")}</div>`;
  h+=`<div class=bar><button class=b onclick="window.print()">Print slip</button><button class="b p" onclick="reset()">${t("again")}</button></div>`}
 if(S.step=="track")h=`<h1>${t("svcTrack")}</h1><input id=tr data-kb=q readonly placeholder="GR0001" onfocus="kb(this)"><div id=tout></div><div class=bar><button class=b onclick="go('svc')">${t("back")}</button><button class="b p" onclick="trk()">${t("enter")}</button></div>`;
 if(S.step=="help")h=`<h1>${t("svcHelp")}</h1><p>Transport authority contact: <b>set by administrator</b>.</p><div class=bar><button class=b onclick="go('svc')">${t("back")}</button></div>`;
 if(S.step=="net")h=`<h1>${t("svcNet")}</h1><div id=kp class=g></div><svg id=map viewBox="0 0 520 330" width="100%"></svg><div class=bar><button class=b onclick="go('svc')">${t("back")}</button></div>`;
 if(S.step=="exam"){const r=S.ex;if(!r){h=`<h1>Running exam-day plan…</h1>`;fetch("/api/sim/exam",{method:"POST",body:"{}"}).then(x=>x.json()).then(x=>{S.ex=x;if(S.step=="exam")render()})}
  else{const s=r.scenario;h=`<h1 class=e>🚨 ${t("svcExam")}</h1><p>Buses <b>${Object.keys(s.buses_down).join(" + ")}</b> down · <b>+${s.surge_added}</b> students · ${s.flood} · exams within 2 hours</p><div class=g>`+[["Students",r.demand],["Seats",r.capacity],["Seated now",r.seated],["Exam seated",r.exam_seated+"/"+r.exam_total],["Exam on time",r.exam_on_time+"/"+r.exam_total],["Second batch",r.second_batch.seated]].map(x=>`<div class=card><div class=n>${x[1]}</div>${x[0]}</div>`).join("")+`</div><div class=card><b>Solution</b><ul><li>Exam students seated first, earliest exam first.</li>`+r.recommend.map(x=>`<li>${x}</li>`).join("")+`</ul></div><table><tr><th>Vehicle</th><th>Seated</th><th>Exam</th></tr>`+r.vehicles.map(v=>`<tr><td>${v.id} ${v.kind} · ${dep(v.id)}</td><td>${v.seated}/${v.cap}</td><td>${v.exam}</td></tr>`).join("")+`</table><svg id=map viewBox="0 0 520 330" width="100%"></svg><div id=kp></div><div class=bar><button class=b onclick="go('svc')">${t("back")}</button><button class="b t" onclick="say(sumEx())">🔊</button></div>`}}
 }
 a.innerHTML=h;S.idle=0;if(["net","exam"].includes(S.step)&&(S.step=="net"||S.ex))drawMap();setTimeout(()=>{S.step=="exam"&&S.ex?say(sumEx()):say()},250)}
const DP={B1:"07:15",B2:"07:30",B3:"07:45",A1:"07:20",A2:"07:25",VN1:"07:40",VN2:"07:35"},dep=v=>"departs "+DP[v];
function sumEx(){const r=S.ex;return `Exam day emergency. ${r.seated} of ${r.demand} students seated now, all ${r.exam_seated} exam students first. ${r.recommend.join(". ")}`}
async function drawMap(){const s=await(await fetch("/api/state")).json(),rt=await(await fetch("/api/route?from=Kalpur&to=College")).json(),pt=new Set();if(rt)for(let i=0;i<rt.path.length-1;i++)pt.add([rt.path[i],rt.path[i+1]].sort().join());
 $("map").innerHTML=s.edges.map(e=>{const a=P[e.a],b=P[e.b],g=pt.has([e.a,e.b].sort().join());return `<line x1=${a[0]} y1=${a[1]} x2=${b[0]} y2=${b[1]} stroke="${e.blocked?"#B91C1C":g?"#0D9488":"#94A3B8"}" stroke-width="${g?7:3}" ${e.blocked?'stroke-dasharray="8 6"':""}/>`}).join("")+Object.entries(P).map(([n,p])=>`<circle cx=${p[0]} cy=${p[1]} r=14 fill="${n=="College"?"#1E56A0":"#fff"}" stroke="#1E56A0" stroke-width=3 /><text x=${p[0]} y=${p[1]-20} text-anchor=middle font-size=15>${n}</text>`).join("");
 const fr=s.vehicles.filter(v=>v.status=="available").reduce((a,v)=>a+v.free,0);if($("kp")&&S.step=="net")$("kp").innerHTML=[["Students",s.students],["No seat",s.waiting],["Free seats",fr],["Blocked roads",s.edges.filter(e=>e.blocked).length]].map(x=>`<div class=card><div class=n>${x[1]}</div>${x[0]}</div>`).join("")}
function chk(){if(S.d.name.trim().length<2){$("er").textContent=t("err");return}const n=+S.d.seats;if(!(n>=1&&n<=10)){$("er").textContent="Seats 1-10";return}go("review")}
async function submit(){go("busy");const d=S.d,b={...d,road:d.problem=="road"?d.road.split("-"):[]};try{S.res=await(await fetch("/api/request",{method:"POST",body:JSON.stringify(b)})).json()}catch(e){S.res={error:"Local server not reachable"}}go("res")}
async function trk(){const r=await(await fetch("/api/track?ref="+$("tr").value)).json();$("tout").innerHTML=r.error?`<p class=e>${r.error}</p>`:`<p><b>${r.ref}</b> ${r.status} · ${r.allocated}/${r.requested} seats</p>`}
let cur=null;const kbe=$("kb");
kbe.onclick=e=>{const c=e.target.dataset.c;if(!c||!cur)return;S.idle=0;if(c=="✔")return kbHide();if(c=="🌐"){S.eng=!S.eng;return kb(cur)}let v=cur.value;v=c=="⌫"?v.slice(0,-1):c=="✕"?"":c=="␣"?v+" ":v+c;if(cur.dataset.kb=="n")v=v.slice(0,2);cur.value=v;if(cur.id in S.d)S.d[cur.id]=v}
function kb(el){cur=el;const L=KBL[SCR[S.lang]],num=el.dataset.kb=="n",nat=L&&!S.eng&&!num;let rows=num?["123","456","789","0"]:nat?[QW[0],...L]:QW;
 kbe.style.display="block";kbe.innerHTML=rows.map(r=>`<div class=r>`+[...r].map(c=>`<button data-c="${c}">${c}</button>`).join("")+"</div>").join("")+`<div class=r>`+(!num&&L?`<button data-c="🌐">🌐 ${S.eng?"Native":"ABC"}</button>`:"")+`<button style="flex:3" data-c="␣">␣</button><button data-c="⌫">⌫</button><button data-c="✕">✕</button><button data-c="✔">✔ Done</button></div>`;el.scrollIntoView({block:"start"})}
function kbHide(){kbe.style.display="none"}
function say(x){if(S.mute||!window.speechSynthesis)return;const L=RC[S.lang],vs=speechSynthesis.getVoices(),p=L.slice(0,2),v=vs.find(v=>v.lang.replace("_","-").toLowerCase()==L.toLowerCase())||vs.find(v=>v.lang.toLowerCase().startsWith(p)),u=new SpeechSynthesisUtterance(typeof x=="string"?x:$("app").innerText.replace(/\s+/g," ").slice(0,320));u.lang=v?v.lang:L;if(v)u.voice=v;u.rate=S.slow?.7:.95;speechSynthesis.cancel();speechSynthesis.speak(u)}
const EXW=["crisis","emergency","आपात","ತುರ್ತು"],NETW=["network","status","map","नेटवर्क","ನೆಟ್‌ವರ್ಕ್"];
function listen(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition,p=$("vp");p.style.display="block";if(!SR){p.textContent="Voice input needs Chrome or Edge. Use touch instead.";return}
 const r=new SR();r.lang=RC[S.lang];r.interimResults=false;p.innerHTML=`🎤 Listening in <b>${r.lang}</b>… speak now`;
 r.onerror=e=>p.textContent="Could not hear you ("+e.error+"). Tap the microphone and try again.";
 r.onresult=async e=>{const tx=e.results[0][0].transcript,lo=tx.toLowerCase();if(EXW.some(w=>lo.includes(w))){p.innerHTML=`You said: <b>${tx}</b>`;S.ex=null;return go("exam")}if(NETW.some(w=>lo.includes(w))){p.innerHTML=`You said: <b>${tx}</b>`;return go("net")}
  const a=await(await fetch("/api/intent",{method:"POST",body:JSON.stringify({text:tx,lang:S.lang})})).json();p.innerHTML=`You said: <b>${tx}</b><br>→ ${a.say}`;say(a.say)};r.start()}
setInterval(()=>{S.idle++;if(S.idle>90&&S.step!="lang")reset()},1000);reset();
</script></body></html>
