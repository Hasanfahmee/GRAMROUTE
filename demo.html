<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRAMROUTE Live Demo</title>
<style>body{font:18px system-ui;background:#F8FAFC;color:#334155;margin:0;padding:14px}h1{color:#1E56A0;margin:.2em 0}button{font:inherit;font-weight:700;padding:14px 18px;margin:4px;border:0;border-radius:12px;background:#1E56A0;color:#fff}
.t{background:#0D9488}.r{background:#64748B}.x{background:#B91C1C}.row{display:flex;flex-wrap:wrap;gap:14px}.c{background:#fff;border:2px solid #E2E8F0;border-radius:14px;padding:12px;flex:1;min-width:300px}.n{font-size:2.2rem;font-weight:800;color:#1E56A0}
.bar{height:14px;background:#E2E8F0;border-radius:7px;margin:2px 0 8px}.bar i{display:block;height:14px;border-radius:7px;background:#0D9488}.bad{color:#B91C1C}.g{color:#0D9488}table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #E2E8F0;text-align:left}small{color:#64748B}</style></head><body>
<h1>GRAMROUTE · live crisis control</h1>
<div><button class=x onclick="run('exam')">⚠ EXAM DAY CRISIS</button><button onclick="run('bus')">Bus breakdown</button><button onclick="run('road')">Road closure</button><button onclick="run('surge')">Demand surge</button><button class=t onclick="run('all')">Combined</button><button class=r onclick="run('reset')">Reset</button><button class=t onclick="spk()">🔊 Speak summary</button><button class=t onclick="listen()">🎤 Talk to GRAMROUTE</button><a href="/">Student kiosk</a></div>
<div id=hear style="min-height:1.4em"></div>
<div class=row><div class=c><b>Road network</b> · red dashed = blocked · green = recommended route from Kalpur<svg id=map viewBox="0 0 520 330" width="100%"></svg></div><div class=c><div id=kp class=row></div><b>Vehicle load</b><div id=vf></div></div></div>
<div class=c id=ex style="margin-top:14px;font-size:19px">Press a button or say “exam crisis”. Every button changes the real database and runs the real engine.</div>
<small>Fictional demo data. Travel times are estimates.</small>
<script>
const P={Kalpur:[70,250],Junction:[260,160],College:[450,160],Mudhol:[150,50],Hosagram:[260,300]},$=i=>document.getElementById(i);let sum="";
const post=async u=>(await fetch(u,{method:"POST",body:"{}"})).json();
async function draw(){const s=await(await fetch("/api/state")).json(),rt=await(await fetch("/api/route?from=Kalpur&to=College")).json(),pth=new Set();
 if(rt)for(let i=0;i<rt.path.length-1;i++)pth.add([rt.path[i],rt.path[i+1]].sort().join());
 $("map").innerHTML=s.edges.map(e=>{const a=P[e.a],b=P[e.b],g=pth.has([e.a,e.b].sort().join());return `<line x1=${a[0]} y1=${a[1]} x2=${b[0]} y2=${b[1]} stroke="${e.blocked?"#B91C1C":g?"#0D9488":"#94A3B8"}" stroke-width="${g?7:3}" ${e.blocked?'stroke-dasharray="8 6"':""}/>`}).join("")+Object.entries(P).map(([n,p])=>`<circle cx=${p[0]} cy=${p[1]} r=14 fill="${n=="College"?"#1E56A0":"#fff"}" stroke="#1E56A0" stroke-width=3 /><text x=${p[0]} y=${p[1]-20} text-anchor=middle font-size=15>${n}</text>`).join("");
 const fr=s.vehicles.filter(v=>v.status=="available").reduce((a,v)=>a+v.free,0);
 $("kp").innerHTML=[["Students",s.students],["No seat",s.waiting],["Free seats",fr],["Blocked roads",s.edges.filter(e=>e.blocked).length]].map(x=>`<div><div class=n>${x[1]}</div>${x[0]}</div>`).join("");
 $("vf").innerHTML=s.vehicles.map(v=>`${v.id} ${v.kind} · ${v.status}${v.status=="cancelled"?"":` · ${v.cap-v.free}/${v.cap}`}<div class=bar><i style="width:${v.status=="cancelled"?0:100*(v.cap-v.free)/v.cap}%"></i></div>`).join("")}
function exam(r){const s=r.scenario;return `<h2 style="margin:0;color:#B91C1C">Exam Day Crisis</h2><p>Buses <b>${Object.keys(s.buses_down).join(" + ")}</b> down (${Object.values(s.buses_down).reduce((a,b)=>a+b,0)} students lose their bus) · demand <b>+${s.surge_added}</b> students · ${s.flood} · exams within 2 hours</p>
<div class=row>${[["Demand",r.demand],["Seats",r.capacity],["Seated",r.seated],["No seat",r.unallocated],["Exam seated",r.exam_seated+"/"+r.exam_total],["Exam on time",r.exam_on_time+"/"+r.exam_total]].map(x=>`<div><div class=n>${x[1]}</div>${x[0]}</div>`).join("")}</div>
<p>Without planning: <b class=bad>${r.without_system}</b> students without a ride → with GRAMROUTE: <b class=bad>${r.unallocated}</b> (and <b class=g>every exam student seated first</b>).</p>
<table><tr><th>Vehicle</th><th>Seated/Capacity</th><th>Exam students</th></tr>${r.vehicles.map(v=>`<tr><td>${v.id} ${v.kind}</td><td>${v.seated}/${v.cap}</td><td>${v.exam}</td></tr>`).join("")}</table>
<p><b>Travel to college (open roads, estimate):</b> ${Object.entries(r.travel_min).map(([k,v])=>k+" "+v+" min").join(" · ")}</p>
${r.at_risk.length?`<p class=bad><b>At risk:</b> ${r.at_risk.map(a=>`${a.village} exam in ${a.exam_in_min} min, needs ${Math.round(a.travel_min)}`).join("; ")}</p>`:""}
<p><b>Recommendations:</b></p><ul>${r.recommend.map(x=>`<li>${x}</li>`).join("")}</ul><p><b>Why:</b> ${r.explain.join(" ")}</p>`}
async function run(k){let out=[];if(k=="reset"){await post("/api/reset");sum="Demo reset.";$("ex").textContent=sum;return draw()}
 if(k=="exam"){const r=await post("/api/sim/exam");$("ex").innerHTML=exam(r);sum=`Exam day crisis. Two buses down, demand up ${r.scenario.surge_added} students, flooded road closed. ${r.seated} of ${r.demand} students seated. All ${r.exam_seated} exam students seated first, ${r.exam_on_time} can arrive on time. ${r.unallocated} students still need transport. ${r.recommend[0]}.`;spk();return draw()}
 if(k=="all")await post("/api/reset");
 if(k=="bus"||k=="all"){const r=await post("/api/sim/bus");out.push(r.affected?`<b>Bus ${r.vehicle} cancelled:</b> ${r.affected} students stranded; GRAMROUTE re-seated <b>${r.accommodated}</b> on ${Object.entries(r.deployed).map(([a,b])=>a+" ("+b+")").join(", ")}; <b class=bad>${r.waiting} waiting</b>. ${r.suggest}.`:"Bus already cancelled. Press Reset.")}
 if(k=="road"||k=="all"){const r=await post("/api/sim/road"),p=r.routes.Kalpur;out.push(`<b>Road Junction–College closed.</b> Kalpur reroute: ${p?p.path.join(" → ")+" ("+Math.round(p.mins)+" min)":"none"}. Uses closed road: ${r.uses_closed}.`)}
 if(k=="surge"||k=="all"){const r=await post("/api/sim/surge");out.push(`<b>Demand surge:</b> ${r.demand} students vs ${r.capacity} seats: ${r.allocated} seated, <b class=bad>${r.unallocated} not</b>. ${r.recommend}.`)}
 $("ex").innerHTML=out.join("<hr>");sum=$("ex").innerText;spk();draw()}
function spk(){if(!sum||!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(sum);u.lang="en-IN";speechSynthesis.cancel();speechSynthesis.speak(u)}
function listen(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$("hear").textContent="Voice input needs Chrome.";return}
 const r=new SR();r.lang="en-IN";$("hear").textContent="🎤 Listening…";r.onerror=e=>$("hear").textContent="Could not hear ("+e.error+")";
 r.onresult=e=>{const t=e.results[0][0].transcript.toLowerCase();$("hear").innerHTML="Heard: <b>"+t+"</b>";const m=[["exam","exam"],["combined","all"],["all","all"],["flood","road"],["road","road"],["surge","surge"],["demand","surge"],["bus","bus"],["reset","reset"],["summary","spk"],["read","spk"]].find(x=>t.includes(x[0]));
  if(!m){$("hear").innerHTML+=" · try: exam crisis, bus breakdown, road closure, demand surge, reset";return}m[1]=="spk"?spk():run(m[1])};r.start()}
draw();
</script></body></html>
